[build-system]
requires=["hatchling==1.27.0"]
build-backend="hatchling.build"

[project]
name="personal-health-api"
version="0.0.0"
description="Personal Health domain API"
requires-python=">=3.12"
dependencies=["fastapi>=0.118,<1","pydantic>=2.11,<3","pydantic-settings>=2.10,<3","sqlalchemy>=2.0,<3","alembic>=1.16,<2","psycopg[binary]>=3.2,<4","uvicorn[standard]>=0.37,<1","httpx>=0.28,<1","cryptography>=46,<51","google-auth[requests]>=2.59,<3","firebase-admin>=6.9,<8","google-cloud-storage>=3.4,<4"]

[project.optional-dependencies]
dev=["pytest>=8.4,<9","pytest-asyncio>=1.2,<2","ruff>=0.13,<1","mypy>=1.18,<2"]

[tool.hatch.build.targets.wheel]
packages=["src/health_api"]

[tool.pytest.ini_options]
testpaths=["tests"]

[tool.ruff]
line-length=100

[tool.mypy]
python_version="3.12"
strict=true

[tool.ruff.lint.isort]
known-first-party = ["health_api"]

# Shared modules use canonical 88-column formatting; glob paths work from both
# the repository CI root and services/api. Lint/type checks still include them.
[tool.ruff.format]
exclude = [
    "**/health_api/integrations/task_control.py",
    "**/health_api/integrations/task_wire.py",
    "**/migrations/versions/20261006b1a2_proposal_receipt_replay_keys.py",
    "**/migrations/versions/20261007a0b1_healthkit_review_contracts.py",
    "**/migrations/versions/20261007b1c2_owner_export_erasure.py",
    "**/migrations/versions/20261014c1d2_delegated_source_commands.py",
    "**/migrations/versions/22dad79c2ee1_initial_profile_persistence.py",
    "**/migrations/versions/4c168e5219d2_require_profile_payload_identity_fields.py",
    "**/migrations/versions/6a0b1c2d3e4f_ai_search_safe_relationship_projection.py",
    "**/migrations/versions/8e31c7c9a0b2_add_daily_event_observation_storage.py",
    "**/migrations/versions/a7f014edc620_phase4_review_corrections.py",
    "**/migrations/versions/b8a125fec731_allow_retired_manual_plan_items.py",
    "**/migrations/versions/b9f5e1a72c4d_daily_snapshot_commit_boundaries.py",
    "**/migrations/versions/c3721f5a9a01_add_firebase_identity_mapping.py",
    "**/migrations/versions/c8d9e0f1a2b3_healthkit_imports.py",
    "**/migrations/versions/d4e5f607a8b9_add_planning_schedules_and_trackers.py",
    "**/migrations/versions/e7f6a5b4c3d2_action_proposal_store.py",
    "**/migrations/versions/f5c0a1e2d3b4_add_ai_full_text_indexes.py",
    "**/migrations/versions/f7c8d9e0a1b2_phase7_analytics_artifacts.py",
]
