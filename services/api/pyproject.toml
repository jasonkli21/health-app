[build-system]
requires=["hatchling==1.27.0"]
build-backend="hatchling.build"

[project]
name="personal-health-api"
version="0.0.0"
description="Personal Health domain API"
requires-python=">=3.12"
dependencies=["fastapi>=0.118,<1","pydantic>=2.11,<3","pydantic-settings>=2.10,<3","sqlalchemy>=2.0,<3","alembic>=1.16,<2","psycopg[binary]>=3.2,<4","uvicorn[standard]>=0.37,<1","httpx>=0.28,<1"]

[project.optional-dependencies]
dev=["pytest>=8.4,<9","pytest-asyncio>=1.2,<2","ruff>=0.13,<1","mypy>=1.18,<2"]

[tool.hatch.build.targets.wheel]
packages=["src/health_api"]

[tool.pytest.ini_options]
testpaths=["tests"]

[tool.ruff]
line-length=100

[tool.mypy]
python_version="3.12"
strict=true
