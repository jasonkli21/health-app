services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: health
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - health_pgdata:/var/lib/postgresql/data

volumes:
  health_pgdata:
