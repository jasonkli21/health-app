name: CI

on:
  push:
  pull_request:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: health
          POSTGRES_PASSWORD: health
          POSTGRES_DB: health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health -d health_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "pnpm"
      - run: python scripts/verify_scaffold.py
      - run: pip install -c services/api/requirements-dev.lock -e 'services/api[dev]'
      - run: pytest -c services/api/pyproject.toml services/api/tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://health:health@127.0.0.1:5432/health_test
      - run: |
          ruff check --config services/api/pyproject.toml services/api/src services/api/tests services/api/scripts scripts
          ruff format --check --config services/api/pyproject.toml services/api/src services/api/tests services/api/scripts scripts
          mypy --config-file services/api/pyproject.toml services/api/src services/api/scripts scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm api-client:generate
      - run: git diff --exit-code -- contracts/openapi/openapi.json packages/api-client/src/generated.ts
      - run: pnpm api-client:typecheck
      - run: pnpm mobile:lint
      - run: pnpm --filter @personal-health/mobile typecheck
      - run: pnpm mobile:test
